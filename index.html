<style>
  /* ========================================
     Yikang Yu | Academic Website
     Refined editorial style
     ======================================== */

  :root {
    --bg-color: #fbf9f5;
    --surface-color: #fffefa;
    --text-main: #242522;
    --text-muted: #686a65;
    --accent-color: #365c55;
    --accent-light: #e8eee9;
    --line-color: #d8d5cd;
    --line-strong: #55564f;

    --font-heading: "Playfair Display", Georgia, serif;
    --font-body: "Source Serif 4", Georgia, serif;

    --content-width: 860px;
    --section-space: 48px;
    --radius: 4px;
  }

  /* 1. Global */

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
    scroll-padding-top: 24px;
  }

  body {
    margin: 0;
    padding: 48px 24px 80px;
    background: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection {
    background: var(--accent-light);
    color: var(--text-main);
  }

  a {
    color: var(--accent-color);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    transition: color 0.2s ease;
  }

  a:hover {
    color: var(--text-main);
  }

  a:focus-visible {
    outline: 2px solid var(--accent-color);
    outline-offset: 4px;
    border-radius: 2px;
  }

  .container {
    width: 100%;
    max-width: var(--content-width);
    margin: 0 auto;
  }

  /* 2. Header and navigation */

  header {
    padding: 24px 0 20px;
    margin-bottom: 48px;
    border-top: 2px solid var(--text-main);
    border-bottom: 1px solid var(--line-color);
  }

  .title-wrapper {
    display: inline-block;
    margin-bottom: 20px;
  }

  .site-title {
    margin: 0;
    padding: 0;
    color: var(--text-main);
    font-family: var(--font-heading);
    font-size: clamp(2.1rem, 5vw, 2.65rem);
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.2;
  }

  nav {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 30px;
  }

  nav a {
    position: relative;
    padding: 4px 0;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 0.83
